<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JerkWad Arena — Quantum Doom Multiplayer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0e1a; color: #c5d4e8; font-family: system-ui, sans-serif;
    min-height: 100vh; padding: 16px; padding-top: calc(env(safe-area-inset-top) + 16px); }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { color: #9966ff; letter-spacing: 0.2em; font-size: 22px; margin-bottom: 2px; }
  .sub { color: #6b7d99; font-size: 12px; margin-bottom: 18px; }
  .panel { background: #0f1626; border: 1px solid #243759; border-radius: 6px;
    padding: 14px; margin-bottom: 14px; }
  label.lbl { display: block; font-size: 11px; color: #6b7d99; text-transform: uppercase;
    letter-spacing: 0.1em; margin-bottom: 4px; }
  input[type="range"] { width: 100%; }
  input[type="text"] { width: 100%; background: #0a0e1a; color: #c5d4e8;
    border: 1px solid #243759; border-radius: 4px; padding: 8px; font-size: 14px; }
  select { background: #0a0e1a; color: #c5d4e8; border: 1px solid #243759;
    border-radius: 4px; padding: 8px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  .btn { display: inline-block; border-radius: 4px; font-weight: 700; letter-spacing: 0.1em;
    font-size: 13px; padding: 12px 18px; cursor: pointer; border: 1px solid; background: none; }
  .btn.gen  { background: #9966ff; border-color: #9966ff; color: #0a0e1a; }
  .btn.play { background: #ff5c5c; border-color: #ff5c5c; color: #0a0e1a; }
  .btn.join { background: #7fffd4; border-color: #7fffd4; color: #0a0e1a; padding: 8px 14px; }
  .btn:disabled { background: #152033; border-color: #243759; color: #6b7d99; cursor: default; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .toggle input { width: 20px; height: 20px; }
  canvas#mapview { width: 100%; background: #06090f; border: 1px solid #243759;
    border-radius: 4px; image-rendering: pixelated; display: block; }
  .stat { font-family: ui-monospace, monospace; font-size: 12px; color: #6b7d99; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #6b7d99; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.1em; padding: 6px 8px; border-bottom: 1px solid #243759; }
  td { padding: 8px; border-bottom: 1px solid #152033; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .ok { background: #7fff7f; } .warn { background: #ff9d3d; } .err { background: #ff5c5c; }
  #relaystat { font-size: 11px; color: #6b7d99; }
  .hintline { font-size: 12px; color: #ff9d3d; min-height: 1.4em; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>JERKWAD ARENA</h1>
  <div class="sub">quantum-generated multiplayer Doom — powered by ShapeShifter + Chocolate Doom WASM
    &nbsp;·&nbsp; <span id="relaystat">checking relay…</span></div>

  <div class="panel">
    <div class="grid">
      <div>
        <label class="lbl">Rooms: <span id="roomsv">12</span></label>
        <input type="range" id="rooms" min="3" max="60" value="12">
      </div>
      <div>
        <label class="lbl">Enemies: <span id="enemiesv">30</span></label>
        <input type="range" id="enemies" min="0" max="100" value="30">
      </div>
      <div>
        <label class="lbl">Level name</label>
        <input type="text" id="lvlname" maxlength="24" placeholder="MY ARENA" value="">
      </div>
      <div class="row" style="align-items: flex-end;">
        <div>
          <label class="lbl">Players</label>
          <select id="players">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>
        <label class="toggle"><input type="checkbox" id="dm"> Deathmatch</label>
        <label class="toggle"><input type="checkbox" id="pub"> Public</label>
      </div>
    </div>
    <div class="row" style="margin-top: 14px;">
      <button class="btn gen" id="generate">⚛ GENERATE LEVEL</button>
      <button class="btn play" id="play" disabled>PLAY</button>
      <span class="stat" id="genstat"></span>
    </div>
    <div class="hintline" id="hint"></div>
  </div>

  <div class="panel">
    <label class="lbl">Level map</label>
    <canvas id="mapview" width="820" height="500"></canvas>
    <div class="stat" id="mapstat">generate a level to see its map</div>
  </div>

  <div class="panel">
    <label class="lbl">Public arenas</label>
    <table>
      <thead><tr><th>Name</th><th>Size</th><th>Players</th><th></th></tr></thead>
      <tbody id="lobby"><tr><td colspan="4" style="color:#6b7d99">loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script src="engine.js"></script>
<script>
// ---------------------------------------------------------------------------
// JerkWad Arena. Generates a multiplayer-ready ShapeShifter level from two
// sliders, renders its automap, and hosts/joins netgames over the Cloudflare
// WebSocket relay (workers/doom-relay). JOIN never transfers the WAD — the
// level is rebuilt locally, byte-identical, from {seed, rooms, enemies}.
// ---------------------------------------------------------------------------
const E = window.JerkwadEngine;
// Arena preset pool: everything except 'terrain', whose tightly-packed
// concentric height rings are the worst per-room visplane pressure in the
// library. Corridor-only layout (fuseChance 0) covers the rest — doors
// close off cross-room sightlines so vanilla's 128-visplane budget holds.

const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
// Relay origin (https for API, wss for game traffic). Override: ?relay=host
const RELAY_HOST = qs.get('relay') || 'doom.yuccabucca.com';
const API = 'https://' + RELAY_HOST;
const WSS = 'wss://' + RELAY_HOST;

// Arena preset pool. Excludes:
//  - 'terrain': tightly-packed concentric rings, worst visplane pressure.
//  - hexagons: their E/W sides meet at a VERTEX with no flat wall, so a
//    hexagon anchored east-west can take no corridor at all; when it also
//    can't host a teleport pad it strands itself and everything past it.
//    (Measured: the sole remaining unreachable-room case at 12 rooms.)
const ARENA_PRESETS = E.SHAPESHIFTER_PRESETS.filter(
  p => p.feature !== 'terrain' && p.type !== 'hexagon');
$('rooms').oninput = () => $('roomsv').textContent = $('rooms').value;
$('enemies').oninput = () => $('enemiesv').textContent = $('enemies').value;

const mulberry32 = (a) => () => {
  a |= 0; a = (a + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const quantumSeed = () => {
  const u = new Uint32Array(1);
  crypto.getRandomValues(u);
  return (u[0] & 0x7fffffff) || 1;
};

// ---- multiplayer thing placement ------------------------------------------
// On top of the EtherWad scatter (monsters/goodies/P1/exit) add: P2-P4 co-op
// starts at mutually-farthest rooms, deathmatch starts, weapons in the
// biggest rooms with ammo beside them, and health/armor spread out.
function arenaThings(lvl, rng, playerCount) {
  const sizeOf = r => r.type === 'square' ? Math.max(r.w | 0, r.h | 0) : 2 * (r.r | 0);
  const rooms = lvl.rooms;
  const things = [...lvl.things];
  const sn = v => Math.round(v / 32) * 32;
  const p1 = things.find(t => t.type === 1);
  // Farthest-point sampling from P1's room for P2..P4.
  const chosen = [{ cx: p1 ? p1.x : rooms[0].cx, cy: p1 ? p1.y : rooms[0].cy }];
  for (let p = 2; p <= 4; p++) {
    let best = null, bestD = -1;
    for (const r of rooms) {
      const d = Math.min(...chosen.map(c => Math.hypot(r.cx - c.cx, r.cy - c.cy)));
      if (d > bestD) { bestD = d; best = r; }
    }
    chosen.push({ cx: best.cx, cy: best.cy });
    things.push({ type: p, x: sn(best.cx + 32), y: sn(best.cy + 32), angle: 0, flags: 7 });
  }
  // Deathmatch starts: up to 6 spread rooms (vanilla needs >= 4 for DM).
  const dmRooms = rooms.filter((_, i) => i % Math.max(1, Math.floor(rooms.length / 6)) === 0).slice(0, 6);
  for (const r of dmRooms) {
    things.push({ type: 11, x: sn(r.cx - 64), y: sn(r.cy - 64), angle: Math.floor(rng() * 8) * 45, flags: 7 });
  }
  // Weapons in the biggest rooms, ammo flanking each.
  const bySize = [...rooms].sort((a, b) => sizeOf(b) - sizeOf(a));
  const weapons = [2001, 2002, 2003, 2004, 2001, 2005];   // shotgun x2, chaingun, RL, plasma, saw
  const ammoFor = { 2001: 2008, 2002: 2007, 2003: 2010, 2004: 2047, 2005: 2011 };
  weapons.forEach((w, i) => {
    const r = bySize[i % Math.min(bySize.length, 8)];
    const ox = sn((rng() - 0.5) * sizeOf(r) * 0.3), oy = sn((rng() - 0.5) * sizeOf(r) * 0.3);
    things.push({ type: w, x: sn(r.cx + ox), y: sn(r.cy + oy), angle: 0, flags: 7 });
    things.push({ type: ammoFor[w] || 2007, x: sn(r.cx + ox + 64), y: sn(r.cy + oy), angle: 0, flags: 7 });
    things.push({ type: ammoFor[w] || 2007, x: sn(r.cx + ox - 64), y: sn(r.cy + oy), angle: 0, flags: 7 });
  });
  // Health + armor spread: a couple of medikits, armor at 2 far corners,
  // one backpack near the middle of the map.
  for (let i = 0; i < Math.min(rooms.length, 6); i++) {
    const r = rooms[Math.floor(rng() * rooms.length)];
    things.push({ type: rng() < 0.5 ? 2011 : 2012, x: sn(r.cx + 96), y: sn(r.cy - 96), angle: 0, flags: 7 });
  }
  things.push({ type: 2018, x: sn(chosen[1].cx - 64), y: sn(chosen[1].cy), angle: 0, flags: 7 });
  things.push({ type: 2019, x: sn(chosen[2].cx - 64), y: sn(chosen[2].cy), angle: 0, flags: 7 });
  things.push({ type: 8, x: sn(rooms[Math.floor(rooms.length / 2)].cx), y: sn(rooms[Math.floor(rooms.length / 2)].cy + 96), angle: 0, flags: 7 });
  return things;
}

let current = null;   // { seed, roomCount, enemyCount, map, wadBuf }

function generate(seed) {
  const roomCount = +$('rooms').value;
  const enemyCount = +$('enemies').value;
  seed = seed || quantumSeed();
  const t0 = performance.now();
  const rng = mulberry32(seed);
  const difficulty = enemyCount > 60 ? 'hard' : enemyCount > 25 ? 'medium' : 'easy';
  const lvl = E.etherGenerateLevel({
    rng, presets: ARENA_PRESETS, roomCount, enemyCount, difficulty,
    // Corridor-only (fuseChance 0). Overlap was measured to break
    // reachability — fusion's emitted seam is not reliably walkable, so
    // fused pairs stranded rooms (100% -> 89-94% avg, worst seeds 50%).
    // Corridor-only is provably 100% reachable at 8/20/40/60 rooms, and
    // door-gated sightlines also keep visplanes safe. Room-shape variety
    // comes from the preset mix instead.
    fuseChance: 0,
  });
  const things = arenaThings(lvl, rng, +$('players').value);
  const map = E.generateShapeShifterMap(lvl.rooms, lvl.connections, things, { seed });
  const wadBuf = E.buildWad({ MAP01: map });
  const ms = Math.round(performance.now() - t0);
  current = { seed, roomCount, enemyCount, map, wadBuf };
  $('genstat').textContent = 'seed ' + seed + ' · ' + map.sectors.length + ' sectors · '
    + map.linedefs.length + ' lines · ' + (wadBuf.byteLength >> 10) + ' KB · ' + ms + ' ms';
  $('play').disabled = false;
  drawMap(map);
  return current;
}

// ---- automap render --------------------------------------------------------
function drawMap(map) {
  const cv = $('mapview'), ctx = cv.getContext('2d');
  ctx.fillStyle = '#06090f';
  ctx.fillRect(0, 0, cv.width, cv.height);
  const vs = new Map(map.vertices.map(v => [v.id, v]));
  let mnx = Infinity, mny = Infinity, mxx = -Infinity, mxy = -Infinity;
  for (const v of map.vertices) {
    mnx = Math.min(mnx, v.x); mxx = Math.max(mxx, v.x);
    mny = Math.min(mny, v.y); mxy = Math.max(mxy, v.y);
  }
  const pad = 20;
  const sc = Math.min((cv.width - pad * 2) / (mxx - mnx), (cv.height - pad * 2) / (mxy - mny));
  const X = (x) => pad + (x - mnx) * sc;
  const Y = (y) => cv.height - pad - (y - mny) * sc;   // doom y up
  // two-sided (passable) lines faint, walls bright — the classic automap look
  for (const pass of [0, 1]) {
    ctx.beginPath();
    for (const l of map.linedefs) {
      const twoSided = l.back !== -1 && l.back != null;
      if ((pass === 0) !== twoSided) continue;
      const a = vs.get(l.v1), b = vs.get(l.v2);
      if (!a || !b) continue;
      ctx.moveTo(X(a.x), Y(a.y));
      ctx.lineTo(X(b.x), Y(b.y));
    }
    ctx.strokeStyle = pass === 0 ? 'rgba(127,255,212,0.25)' : '#c5d4e8';
    ctx.lineWidth = pass === 0 ? 1 : 1.5;
    ctx.stroke();
  }
  // things
  const dot = (x, y, color, r) => {
    ctx.beginPath(); ctx.arc(X(x), Y(y), r, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
  };
  for (const t of map.things) {
    if (t.type >= 1 && t.type <= 4) dot(t.x, t.y, '#7fffd4', 4);
    else if (t.type === 11) dot(t.x, t.y, '#9966ff', 3);
    else if ([2001, 2002, 2003, 2004, 2005, 2006].includes(t.type)) dot(t.x, t.y, '#ffb74d', 3);
    else if ([2007, 2008, 2010, 2047, 8].includes(t.type)) dot(t.x, t.y, '#ffd54f', 2);
    else if ([2011, 2012, 2014, 2018, 2019].includes(t.type)) dot(t.x, t.y, '#4fc3f7', 2);
    else dot(t.x, t.y, '#ff5c5c', 2);
  }
  $('mapstat').textContent = 'cyan ● players 1-4 · purple ● deathmatch starts · '
    + 'orange ● weapons · yellow ● ammo · blue ● health/armor · red ● monsters';
}

// ---- hosting / joining -----------------------------------------------------
function saveWad(buf) {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('jerkwad', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('wads');
    req.onsuccess = () => {
      try {
        const tx = req.result.transaction('wads', 'readwrite');
        tx.objectStore('wads').put(buf, 'current');
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      } catch (e) { reject(e); }
    };
    req.onerror = () => reject(req.error);
  });
}

let relayUp = false;
async function checkRelay() {
  try {
    const r = await fetch(API + '/api/lobby/list', { signal: AbortSignal.timeout(6000) });
    relayUp = r.ok;
  } catch (e) { relayUp = false; }
  $('relaystat').innerHTML = relayUp
    ? '<span class="dot ok"></span>relay online (' + RELAY_HOST + ')'
    : '<span class="dot err"></span>relay offline — solo play only';
}

$('generate').onclick = () => {
  try { generate(); $('hint').textContent = ''; }
  catch (e) { $('hint').textContent = 'generation failed: ' + e.message; }
};

$('play').onclick = () => {
  if (!current) return;
  const nodes = +$('players').value;
  const isPublic = $('pub').checked;
  const dm = $('dm').checked;
  // Synchronous open inside the tap (popup rules), then stage everything.
  const win = window.open('', '_blank');
  (async () => {
    try {
      await saveWad(current.wadBuf);
      let playUrl = '../play/?wait=1';
      if (relayUp && nodes > 1) {
        const nr = await (await fetch(API + '/api/newroom')).json();
        const room = nr.room;
        playUrl += '&ws=' + encodeURIComponent(WSS + '/api/ws/' + room)
          + '&server=1&nodes=' + nodes + (dm ? '&dm=1' : '');
        if (isPublic) {
          await fetch(API + '/api/lobby/register', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              room, name: ($('lvlname').value || 'UNNAMED ARENA').toUpperCase(),
              seed: current.seed, rooms: current.roomCount, enemies: current.enemyCount,
              maxPlayers: nodes, dm,
            }),
          });
          $('hint').textContent = 'Published — waiting for ' + nodes + ' player(s) to join. Game starts when everyone is in.';
        } else {
          $('hint').textContent = 'Private game — share this page and give friends the seed. Game starts when ' + nodes + ' are in.';
        }
      } else {
        $('hint').textContent = nodes > 1
          ? 'Relay offline — starting solo instead.' : 'Starting solo game.';
      }
      if (win) win.location = playUrl;
      refreshLobby();
    } catch (e) {
      if (win) win.close();
      $('hint').textContent = 'PLAY failed: ' + e.message;
    }
  })();
};

// ---- lobby -----------------------------------------------------------------
async function refreshLobby() {
  const tbody = $('lobby');
  if (!relayUp) {
    tbody.innerHTML = '<tr><td colspan="4" style="color:#6b7d99">relay offline — public arenas unavailable</td></tr>';
    return;
  }
  try {
    const list = await (await fetch(API + '/api/lobby/list')).json();
    if (!list.levels || !list.levels.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="color:#6b7d99">no public arenas right now — make one!</td></tr>';
      return;
    }
    tbody.innerHTML = '';
    for (const lv of list.levels) {
      const tr = document.createElement('tr');
      const full = lv.players >= lv.maxPlayers;
      tr.innerHTML = '<td>' + (lv.name || 'UNNAMED') + (lv.dm ? ' <span style="color:#ff5c5c">DM</span>' : '') + '</td>'
        + '<td class="stat">' + lv.rooms + ' rooms · ' + lv.enemies + ' mobs</td>'
        + '<td>' + lv.players + ' / ' + lv.maxPlayers + '</td><td></td>';
      const btn = document.createElement('button');
      btn.className = 'btn join';
      btn.textContent = full ? 'FULL' : 'JOIN';
      btn.disabled = full;
      btn.onclick = () => joinLevel(lv, btn);
      tr.lastChild.appendChild(btn);
      tbody.appendChild(tr);
    }
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="4" style="color:#ff5c5c">lobby error: ' + e.message + '</td></tr>';
  }
}

function joinLevel(lv, btn) {
  btn.textContent = 'BUILDING…';
  const win = window.open('', '_blank');
  (async () => {
    try {
      // Rebuild the host's level locally — deterministic from the seed.
      const rng = mulberry32(lv.seed);
      const difficulty = lv.enemies > 60 ? 'hard' : lv.enemies > 25 ? 'medium' : 'easy';
      const gen = E.etherGenerateLevel({
        rng, presets: ARENA_PRESETS,
        roomCount: lv.rooms, enemyCount: lv.enemies, difficulty,
        fuseChance: 0,   // must match the host's value — determinism
      });
      const things = arenaThings(gen, rng, lv.maxPlayers);
      const map = E.generateShapeShifterMap(gen.rooms, gen.connections, things, { seed: lv.seed });
      await saveWad(E.buildWad({ MAP01: map }));
      const url = '../play/?wait=1&join=1&ws=' + encodeURIComponent(WSS + '/api/ws/' + lv.room);
      if (win) win.location = url;
      btn.textContent = 'JOINED';
    } catch (e) {
      if (win) win.close();
      btn.textContent = 'ERROR';
      $('hint').textContent = 'join failed: ' + e.message;
    }
  })();
}

checkRelay().then(refreshLobby);
setInterval(() => { checkRelay().then(refreshLobby); }, 12000);
</script>
</body>
</html>
