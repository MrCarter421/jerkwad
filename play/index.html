<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JerkWad Player — Chocolate Doom WASM</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e1a">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    background: #0a0e1a; color: #c5d4e8;
    font-family: system-ui, sans-serif; touch-action: none; }
  #stage { position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center; overflow: hidden; }
  /* Desktop: centred at natural size. */
  canvas { background: #000; max-width: 100vw; max-height: 100vh;
    image-rendering: pixelated; display: block; }
  /* Touch devices: the earlier build read canvas.width/height in JS to size
     the frame, but the engine sets the backing store to a FIXED Doom
     resolution independent of the screen — so that math produced a tiny box
     on real phones. Instead let the canvas box fill the viewport and let the
     browser's object-fit preserve the picture's aspect. object-fit reads the
     canvas backing store as the intrinsic size, so `contain` letterboxes the
     game at the largest UNDISTORTED size no matter what resolution the engine
     picked — no JS, nothing to get wrong.
       dvw/dvh track the viewport actually visible under the mobile browser
     chrome (the address bar); vw/vh are the fallback for older engines.
       !important beats the inline width/height SDL writes on the canvas. */
  @media (pointer: coarse) {
    canvas {
      width: 100vw !important;  height: 100vh !important;
      width: 100dvw !important; height: 100dvh !important;
      max-width: none !important; max-height: none !important;
      object-fit: contain;                /* FIT: keep aspect, letterbox */
    }
    body.fill canvas { object-fit: fill; } /* FILL: stretch edge to edge */
  }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; z-index: 50;
    background: #0a0e1a; transition: opacity 0.5s; padding: 24px; text-align: center; }
  #boot h1 { color: #ff9d3d; letter-spacing: 0.2em; font-size: 20px; }
  #boot .bar { width: min(420px, 80vw); height: 10px; border: 1px solid #243759;
    border-radius: 5px; overflow: hidden; }
  #boot .bar > div { height: 100%; width: 0%; background: #7fffd4; transition: width 0.2s; }
  #boot .msg { font-size: 12px; color: #6b7d99; min-height: 2em; }
  #boot.hidden { opacity: 0; pointer-events: none; }
  .pad { position: fixed; z-index: 40; user-select: none; -webkit-user-select: none; }
  .pad button { position: absolute; display: flex; align-items: center; justify-content: center;
    background: rgba(20,32,51,0.55); color: #7fffd4; border: 1px solid rgba(127,255,212,0.5);
    border-radius: 50%; font-size: 15px; font-weight: 700;
    width: 58px; height: 58px; touch-action: none; }
  .pad button:active, .pad button.on { background: rgba(127,255,212,0.35); }
  #dpad { left: calc(env(safe-area-inset-left) + 14px); bottom: calc(env(safe-area-inset-bottom) + 20px);
    width: 180px; height: 180px; }
  #dpad .u { left: 61px; top: 0; }  #dpad .d { left: 61px; bottom: 0; }
  /* Middle row = STRAFE, top corners = TURN. */
  #dpad .l { left: 0; top: 61px; font-size: 11px; }
  #dpad .r { right: 0; top: 61px; font-size: 11px; }
  #dpad .tl { left: 0; top: 0; }
  #dpad .tr { right: 0; top: 0; }
  #acts { right: calc(env(safe-area-inset-right) + 14px); bottom: calc(env(safe-area-inset-bottom) + 20px);
    width: 190px; height: 200px; }
  #acts .fire { right: 0; bottom: 62px; width: 72px; height: 72px; color: #ff5c5c; border-color: rgba(255,92,92,0.55); }
  #acts .use  { right: 84px; bottom: 8px; }
  #acts .run  { right: 84px; bottom: 72px; font-size: 11px; color: #9fd0ff; border-color: rgba(159,208,255,0.55); }
  #acts .run.on { background: rgba(159,208,255,0.42); color: #eaf4ff; }
  #acts .wpn  { right: 84px; bottom: 136px; font-size: 11px; color: #ffb74d; border-color: rgba(255,183,77,0.55); }
  #topbar { position: fixed; top: calc(env(safe-area-inset-top) + 8px); right: 10px; z-index: 40;
    display: flex; gap: 6px; }
  #topbar button { background: rgba(20,32,51,0.55); color: #c5d4e8; border: 1px solid #243759;
    border-radius: 4px; font-size: 11px; padding: 7px 10px; }
  #hint { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 10px;
    font-size: 10px; color: #6b7d99; z-index: 40; max-width: 50vw; }
  @media (hover: hover) and (pointer: fine) {
    /* Desktop: hide touch pads (keyboard play) */
    .pad { display: none; }
  }
</style>
</head>
<body>
<div id="boot">
  <h1>JERKWAD PLAYER</h1>
  <div class="bar"><div id="bootbar"></div></div>
  <div class="msg" id="bootmsg">loading engine…</div>
  <div class="msg" style="opacity:0.5">player build P12</div>
</div>
<div id="stage"><canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas></div>
<div id="hint"></div>
<div id="topbar">
  <button id="btn-sound" style="display:none; background:#ffb74d; color:#0a0e1a; font-weight:700">🔈 SOUND</button>
  <button id="btn-fit">FIT</button>
  <button id="btn-fs">FULLSCREEN</button>
  <button id="btn-esc">MENU</button>
  <button id="btn-yes">Y</button>
  <button id="btn-enter">ENTER</button>
</div>
<div class="pad" id="dpad">
  <button class="u" data-key="38">▲</button>
  <button class="d" data-key="40">▼</button>
  <!-- Strafe sits on the main left/right (the positions your thumb rests on);
       turning moved up to the corners. -->
  <button class="l" data-key="188">⟨STR</button>
  <button class="r" data-key="190">STR⟩</button>
  <button class="tl" data-key="37">◀</button>
  <button class="tr" data-key="39">▶</button>
</div>
<div class="pad" id="acts">
  <button class="fire" data-key="17">FIRE</button>
  <button class="use"  data-key="32">USE</button>
  <button class="run"  id="btn-run">RUN</button>
  <button class="wpn"  id="btn-wpn">WPN</button>
</div>

<script>
// ---------------------------------------------------------------------------
// JerkWad browser player. Boots Chocolate Doom (cloudflare/doom-wasm fork,
// WebSockets netplay build) with freedoom2.wad as the IWAD and — when
// present — the last WAD exported from ShapeShifter, read from IndexedDB
// (db 'jerkwad', store 'wads', key 'current'; written by the DOOM button).
//
// Query params:
//   ?wad=<url>        also merge a PWAD fetched from a URL
//   ?warp=N           warp to MAPxx (default 1 when a user WAD is loaded)
//   ?skill=N          1-5 (default 3)
//   ?ws=wss://host    WebSocket relay (Cloudflare Worker) for multiplayer
//   ?server=1         host a netgame (with ?ws)
//   ?join=1           join a netgame (with ?ws)
//   ?nodes=N          number of players expected when hosting (default 2)
//   ?solo=1           -solo-net (test netgame alone)
// ---------------------------------------------------------------------------
const qs = new URLSearchParams(location.search);
window.addEventListener('error', (e) => {
  try { setBoot(100, 'ERROR: ' + (e.message || e.type) + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); } catch (x) {}
});
window.addEventListener('unhandledrejection', (e) => {
  try { setBoot(100, 'ERROR: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason))); } catch (x) {}
});
const bootEl = document.getElementById('boot');
const bootBar = document.getElementById('bootbar');
const bootMsg = document.getElementById('bootmsg');
const hintEl = document.getElementById('hint');
const setBoot = (pct, msg) => { bootBar.style.width = pct + '%'; if (msg) bootMsg.textContent = msg; };

function readUserWad() {
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open('jerkwad', 1);
      req.onupgradeneeded = () => { req.result.createObjectStore('wads'); };
      req.onsuccess = () => {
        try {
          const tx = req.result.transaction('wads', 'readonly');
          const get = tx.objectStore('wads').get('current');
          get.onsuccess = () => resolve(get.result || null);
          get.onerror = () => resolve(null);
        } catch (e) { resolve(null); }
      };
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

// Engine args must be FINAL before websockets-doom.js is evaluated —
// emscripten snapshots Module.arguments at script load, so we build the
// arg list (async IndexedDB read included) first and inject the engine
// script dynamically afterwards. The binary file staging happens in
// preRun (it needs the runtime FS object).
let userWadBytes = null;

var Module = {
  canvas: document.getElementById('canvas'),
  arguments: [],           // finalized in boot() before script injection
  preRun: [function () {
    // Block run() until the IWAD + optional PWADs are staged into MEMFS.
    Module.addRunDependency('jerkwad-files');
    (async function stage() {
      try {
        setBoot(30, 'fetching freedoom2.wad…');
        const iwadRes = await fetch('freedoom2.wad');
        if (!iwadRes.ok) throw new Error('freedoom2.wad HTTP ' + iwadRes.status);
        let iwad = new Uint8Array(await iwadRes.arrayBuffer());
        // canOwn=true (6th arg): MEMFS takes the typed array instead of
        // copying it — halves peak memory for the 28 MB IWAD, which matters
        // a lot on memory-constrained mobile browsers.
        FS.createDataFile('/', 'freedoom2.wad', iwad, true, true, true);
        setBoot(60, 'IWAD staged (' + (iwad.length >> 20) + ' MB)');
        iwad = null;   // drop our reference; MEMFS owns it now
        if (userWadBytes) {
          FS.createDataFile('/', 'shapeshifter.wad', new Uint8Array(userWadBytes), true, true, true);
          setBoot(70, 'ShapeShifter WAD staged (' + userWadBytes.byteLength + ' bytes)');
          userWadBytes = null;   // free the level bytes after staging
        }
        const wadUrl = qs.get('wad');
        if (wadUrl) {
          setBoot(75, 'fetching ' + wadUrl + '…');
          const r = await fetch(wadUrl);
          if (r.ok) FS.createDataFile('/', 'extra.wad', new Uint8Array(await r.arrayBuffer()), true, true, true);
        }
        setBoot(90, 'starting: ' + Module.arguments.join(' '));
      } catch (e) {
        setBoot(100, 'BOOT FAILED: ' + e.message);
        throw e;
      } finally {
        Module.removeRunDependency('jerkwad-files');
      }
    })();
  }],
  print: (t) => {
    console.log(t);
    // Keep the engine's own words. When a boot or a netgame handshake stalls,
    // this tail is the only thing that says WHERE — and it can be screenshotted
    // off a phone, which a devtools console cannot.
    engineLog.push(t.length > 160 ? t.slice(0, 160) + '…' : t);
    if (engineLog.length > 60) engineLog.shift();
    const lg = document.getElementById('netlog');
    if (lg) lg.textContent = engineLog.slice(-10).join('\n');
    // Engine protocol lines: "doom: N, message"
    if (/^doom: /.test(t)) hintEl.textContent = t.replace(/^doom: \d+,\s*/, '');
    if (/^doom: 10/.test(t)) hintEl.textContent = 'net game started';
    // A fatal engine error (visplane overflow, etc.) prints here right before
    // the runtime exits — surface it on the (re-shown) boot screen instead of
    // leaving a silent black canvas, so crashes are diagnosable.
    if (/I_Error|R_Error|overflow|Error:/i.test(t)) {
      bootEl.classList.remove('hidden');
      setBoot(100, 'ENGINE: ' + t.slice(0, 120));
    }
    if (/^doom: 10/.test(t)) { netLaunched = true; hideNetStatus(); }
    // Relay handshake failure ("doom: 1"). A netgame with a dead socket
    // limps unplayably (the net loop stalls every tic) — stop and offer a
    // clean solo restart instead.
    if (/^doom: 1,/.test(t) && qs.get('ws')) {
      netFailure('RELAY CONNECTION FAILED — the game socket could not reach ' +
        (qs.get('ws') || '').replace(/^wss:\/\//, '').split('/')[0] + '.', true);
    }
    // "doom: 9, disconnected from server" / "doom: 7, failed to connect to …".
    // These had NO handler, which is why a failed join just sat on a black
    // screen with no way out. The overwhelmingly common cause is that the host
    // already started: vanilla Doom has no late join, so the server refuses
    // anyone arriving after launch ("not in waiting start state").
    if (/^doom: (9|7),/.test(t) && qs.get('ws') && !netLaunched) {
      netFailure(qs.get('join')
        ? 'COULD NOT JOIN — the host has already started this game. Vanilla ' +
          'Doom cannot join a match in progress, so ask the host to start a ' +
          'fresh arena and join before they launch.'
        : 'LOST THE CONNECTION to the relay.', false);
    }
  },
  printErr: (t) => console.warn(t),
  onRuntimeInitialized: () => setBoot(95, 'engine ready'),
  // Re-assert a latched RUN once the engine exists: the keydown sent before
  // boot went nowhere.
  postRun: [() => { bootEl.classList.add('hidden'); if (runLocked) applyRunLock(); }],
};

// ---------------------------------------------------------------------------
// NETGAME LOBBY STATUS.
//
// Chocolate Doom's "waiting for players" screen is drawn by the textscreen
// library, which does not render to the canvas in this build — so a host sat
// looking at pure black, assumed it had hung, and pressed START. That begins
// the match with one player, and vanilla Doom has NO late join, so every
// subsequent joiner is refused ("not in waiting start state") and lands on a
// black screen of its own. That single interaction was the whole multiplayer
// bug. So: show the real player count, and refuse to start early by accident.
// ---------------------------------------------------------------------------
let netLaunched = false;
const engineLog = [];
const wsParam = qs.get('ws') || '';
const relayOrigin = wsParam.replace(/^ws/, 'http').replace(/\/api\/ws\/.*$/, '');
const roomId = (wsParam.match(/\/api\/ws\/([^/?]+)/) || [])[1] || null;
const wantNodes = Math.max(2, +(qs.get('nodes') || 2));
let playersIn = 0;

function netStatusEl() {
  let el = document.getElementById('netstatus');
  if (!el) {
    el = document.createElement('div');
    el.id = 'netstatus';
    el.style.cssText = 'position:fixed;inset:0;z-index:46;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;' +
      'background:rgba(10,14,26,0.94);color:#c5d4e8;font-size:14px;line-height:1.6';
    document.body.appendChild(el);
  }
  return el;
}
function hideNetStatus() { const el = document.getElementById('netstatus'); if (el) el.remove(); }

function soloUrl() {
  const solo = new URLSearchParams(location.search);
  solo.delete('ws'); solo.delete('server'); solo.delete('join');
  solo.delete('nodes'); solo.delete('dm');
  return location.pathname + '?' + solo.toString();
}

function renderNetStatus() {
  if (netLaunched) return hideNetStatus();
  const el = netStatusEl();
  const isHost = !!qs.get('server');
  // HONEST LABEL. This number is how many WebSockets the relay has for this
  // room — NOT how many players Doom has finished its handshake with. Calling
  // it "players" made a stuck handshake look like a full lobby that simply
  // refused to start.
  el.innerHTML =
    '<div style="color:#ff9d3d;letter-spacing:.18em;font-weight:700">' +
      (isHost ? 'WAITING TO START' : 'WAITING FOR THE HOST') + '</div>' +
    '<div style="font-size:30px;font-weight:700;color:#7fffd4">' +
      playersIn + ' / ' + wantNodes + '</div>' +
    '<div style="color:#6b7d99;font-size:11px">relay connections (not confirmed Doom players)</div>' +
    '<div style="color:#6b7d99;font-size:12px;max-width:34em">' +
      (isHost
        ? 'The match starts by itself once Doom has everyone. If this sticks, the ' +
          'engine log below shows where it stopped.'
        : 'Connected. The host\'s game starts automatically once everyone is in.') +
    '</div>' +
    '<pre id="netlog" style="font-size:10px;color:#7fffd4;background:#060910;padding:8px;' +
      'border-radius:4px;max-width:92vw;max-height:22vh;overflow:auto;text-align:left;' +
      'white-space:pre-wrap;margin-top:4px"></pre>';
  const pre = el.querySelector('#netlog');
  if (pre) pre.textContent = engineLog.slice(-10).join('\n') || '(waiting for the engine…)';

  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px';
  if (isHost) {
    const b = document.createElement('button');
    const ready = playersIn >= wantNodes;
    b.textContent = ready ? '▶ START NOW' : '▶ START ANYWAY (locks others out)';
    b.style.cssText = 'padding:11px 18px;border:0;border-radius:5px;font-weight:700;' +
      'font-size:13px;background:' + (ready ? '#7fff7f' : '#33405c') + ';color:' +
      (ready ? '#0a0e1a' : '#c5d4e8');
    // Starting without everyone still needs TWO taps — a single tap on a black
    // screen is how the game kept launching with nobody in it, locking joiners
    // out for good. When the relay shows everyone present it is one tap.
    let armed = ready;
    b.onclick = () => {
      if (!armed) { armed = true; b.textContent = '▶ TAP AGAIN TO START WITHOUT THEM'; b.style.background = '#ff9d3d'; b.style.color = '#0a0e1a'; return; }
      sendKey('keydown', 32); setTimeout(() => sendKey('keyup', 32), 80);
      b.disabled = true; b.textContent = 'STARTING…';
    };
    row.appendChild(b);
  }
  // Always an escape. The arena's Players dropdown DEFAULTS TO 2, so anyone
  // who just wants to play alone lands on this screen and used to be stuck
  // here with no way out once the old top-bar START button was removed.
  const solo = document.createElement('a');
  solo.textContent = '▶ PLAY SOLO INSTEAD';
  solo.href = soloUrl();
  solo.style.cssText = 'padding:11px 18px;border-radius:5px;font-weight:700;font-size:13px;' +
    'background:#7fffd4;color:#0a0e1a;text-decoration:none';
  row.appendChild(solo);
  el.appendChild(row);
}

async function pollRoom() {
  if (netLaunched || !roomId || !relayOrigin) return;
  try {
    const r = await fetch(relayOrigin + '/api/room/' + roomId, { cache: 'no-store' });
    if (r.ok) { const j = await r.json(); playersIn = j.players | 0; }
  } catch (e) { /* transient — keep the last count */ }
  renderNetStatus();
}
if (qs.get('ws') && (qs.get('server') || qs.get('join'))) {
  renderNetStatus();
  setInterval(pollRoom, 2000);
  pollRoom();
} else {
  // SOLO watchdog. If the engine has not reported "game started" a good while
  // after boot, show its log rather than leaving a black screen with nothing
  // to report. Costs nothing when the game is running normally.
  setTimeout(() => {
    if (netLaunched) return;
    const el = netStatusEl();
    el.innerHTML =
      '<div style="color:#ff9d3d;letter-spacing:.18em;font-weight:700">GAME DID NOT START</div>' +
      '<div style="color:#6b7d99;font-size:12px;max-width:34em">The engine loaded but never' +
      ' reported "game started". Its last words:</div>' +
      '<pre id="netlog" style="font-size:10px;color:#7fffd4;background:#060910;padding:8px;' +
        'border-radius:4px;max-width:92vw;max-height:40vh;overflow:auto;text-align:left;' +
        'white-space:pre-wrap"></pre>';
    el.querySelector('#netlog').textContent =
      engineLog.slice(-16).join('\n') || '(the engine printed nothing at all)';
    const again = document.createElement('a');
    again.textContent = '↻ RELOAD';
    again.href = location.href;
    again.style.cssText = 'padding:11px 18px;border-radius:5px;font-weight:700;font-size:13px;' +
      'background:#7fffd4;color:#0a0e1a;text-decoration:none';
    el.appendChild(again);
  }, 40000);
}

// Shared failure screen for every netgame dead end, with a solo escape.
function netFailure(msg, withRelayTest) {
  hideNetStatus();
  bootEl.classList.remove('hidden');
  setBoot(100, msg);
  if (!document.getElementById('solo-esc')) {
    const a = document.createElement('a');
    a.id = 'solo-esc';
    a.textContent = '▶ PLAY THIS LEVEL SOLO';
    const solo = new URLSearchParams(location.search);
    solo.delete('ws'); solo.delete('server'); solo.delete('join');
    solo.delete('nodes'); solo.delete('dm');
    a.href = location.pathname + '?' + solo.toString();
    a.style.cssText = 'display:inline-block;margin-top:10px;padding:10px 16px;' +
      'background:#7fffd4;color:#0a0e1a;font-weight:700;border-radius:4px;text-decoration:none';
    bootEl.appendChild(a);
    if (withRelayTest) addRelayTest();
  }
}

// Relay self-test shown on the connection-failure screen. It splits the two
// possible causes apart so a bug report can be specific:
//   HEALTH  — a plain GET; proves DNS + the Cloudflare route + the worker.
//   ECHO    — a WebSocket that echoes a byte; proves WebSockets actually
//             upgrade through Cloudflare (the part a plain HTTPS check misses).
// If both pass but the game still won't connect, the fault is the Doom netgame
// layer, not the relay — which is a very different fix.
function addRelayTest() {
  if (document.getElementById('relay-test')) return;
  const ws = qs.get('ws') || '';
  const origin = ws.replace(/^wss:/, 'https:').replace(/\/api\/ws\/.*$/, '');
  const line = document.createElement('div');
  line.id = 'relay-test';
  line.style.cssText = 'margin-top:14px;font-size:12px;color:#c5d4e8;max-width:90vw;line-height:1.7';
  bootEl.appendChild(line);
  const set = (html) => { line.innerHTML = 'relay self-test:<br>' + html; };
  let health = '…', echo = '…';
  const paint = () => set('&nbsp;&nbsp;HEALTH (route): ' + health + '<br>&nbsp;&nbsp;ECHO (websocket): ' + echo);
  paint();

  fetch(origin + '/api/health', { cache: 'no-store' })
    .then(r => r.json())
    .then(j => { health = '✅ up, build ' + (j.build || '?'); paint(); })
    .catch(e => { health = '❌ ' + e.message + ' (route/DNS/worker not reachable)'; paint(); });

  try {
    const probe = new WebSocket(origin.replace(/^https:/, 'wss:') + '/api/echo');
    probe.binaryType = 'arraybuffer';
    const timer = setTimeout(() => { echo = '❌ timeout (WebSockets not upgrading)'; paint(); try { probe.close(); } catch (x) {} }, 8000);
    probe.onopen = () => probe.send(new Uint8Array([1, 2, 3, 4]));
    probe.onmessage = (m) => { clearTimeout(timer); echo = '✅ round-trip ok'; paint(); probe.close(); };
    probe.onerror = () => { clearTimeout(timer); echo = '❌ connection failed (Cloudflare WebSockets off, or worker not redeployed)'; paint(); };
    probe.onclose = (e) => { if (echo === '…') { clearTimeout(timer); echo = '❌ closed before echo (code ' + e.code + ')'; paint(); } };
  } catch (e) { echo = '❌ ' + e.message; paint(); }
}
// ---------------------------------------------------------------------------
// AUDIO. Two things made sound arrive late and inconsistently:
//
//  1. SDL creates its AudioContext when the game opens the audio device, well
//     into engine startup. A context created without a user gesture starts
//     SUSPENDED, so the opening sounds were written into a context that
//     wasn't running yet.
//  2. Emscripten's autoResumeAudioContext() arms its resume handler with
//     listenOnce — a ONE-SHOT listener, on document/#canvas only, for
//     keydown/mousedown/touchstart. If that first gesture landed before the
//     context existed, or the tab was backgrounded (which re-suspends the
//     context), nothing ever re-armed it and audio stayed dead or came back
//     at random.
//
// So: build the context ourselves at page load, hand it to SDL (the glue does
// `if (!SDL2.audioContext)` and adopts ours), and keep a PERSISTENT resume
// handler on every gesture plus tab re-focus.
// ---------------------------------------------------------------------------
const AudioCtor = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
if (AudioCtor) {
  try {
    audioCtx = new AudioCtor({ latencyHint: 'interactive' });
    Module.SDL2 = Module.SDL2 || {};
    Module.SDL2.audioContext = audioCtx;
  } catch (e) { audioCtx = null; }
}
function resumeAudio() {
  if (!audioCtx) return;
  if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
  updateSoundHint();
}
function updateSoundHint() {
  const b = document.getElementById('btn-sound');
  if (!b) return;
  b.style.display = (audioCtx && audioCtx.state !== 'running') ? '' : 'none';
}
// capture:true so a control that calls preventDefault/stopPropagation on its
// own touch handling can never starve the resume.
['pointerdown', 'touchstart', 'mousedown', 'keydown', 'click'].forEach(ev =>
  window.addEventListener(ev, resumeAudio, { capture: true, passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) resumeAudio(); });
if (audioCtx) audioCtx.onstatechange = updateSoundHint;

// ---------------------------------------------------------------------------
// LAYOUT is CSS now (see the `pointer: coarse` block). The canvas box fills
// the visible viewport (100dvw x 100dvh) and object-fit does the aspect work:
//   FIT  = object-fit: contain — largest UNDISTORTED size, letterboxed
//   FILL = object-fit: fill    — stretched edge to edge
// object-fit reads the engine's real backing store, so nothing here needs to
// know or guess the resolution. The only JS is the toggle.
// ---------------------------------------------------------------------------
let fitMode = 'fit';
try { fitMode = localStorage.getItem('jerkwadFit') || 'fit'; } catch (e) {}
function applyFit() { document.body.classList.toggle('fill', fitMode === 'fill'); }
applyFit();

// Hide the boot screen the moment the canvas starts rendering.
const bootHider = setInterval(() => {
  const c = Module.canvas;
  if (c.width > 64) { bootEl.classList.add('hidden'); clearInterval(bootHider); }
}, 500);

// Build the final argument list, then inject the engine script.
(async function boot() {
  setBoot(5, 'reading saved WAD…');
  userWadBytes = await readUserWad();
  // Opened by the editor's DOOM button? The WAD write races our load —
  // poll for up to 6 s before concluding there's no user level.
  if ((qs.get('wait') || window.opener) && (!userWadBytes || userWadBytes.byteLength <= 16)) {
    for (let i = 0; i < 20 && (!userWadBytes || userWadBytes.byteLength <= 16); i++) {
      await new Promise(r => setTimeout(r, 300));
      userWadBytes = await readUserWad();
    }
  }
  if (userWadBytes && userWadBytes.byteLength <= 16) userWadBytes = null;
  const args = ['-iwad', 'freedoom2.wad', '-nomusic'];
  let haveUserWad = !!userWadBytes;
  if (haveUserWad) args.push('-merge', 'shapeshifter.wad');
  if (qs.get('wad')) { args.push('-merge', 'extra.wad'); haveUserWad = true; }
  const joiningEarly = qs.get('ws') && qs.get('join');
  if (!joiningEarly) {
    const warp = qs.get('warp') || (haveUserWad ? '1' : null);
    if (warp) args.push('-warp', warp);
    args.push('-skill', qs.get('skill') || '3');
  }
  const ws = qs.get('ws');
  const joining = ws && qs.get('join');
  if (ws) {
    args.push('-wss', ws);
    if (qs.get('server')) {
      args.push('-server');
      args.push('-nodes', qs.get('nodes') || '2');
      if (qs.get('dm')) args.push('-deathmatch');
    } else if (joining) {
      // The doom server peer is always uid 1 on the relay; the websocket
      // transport resolves -connect via atoi(), so the address is "1".
      args.push('-connect', '1');
    }
    if (qs.get('solo')) args.push('-solo-net');
    hintEl.textContent = 'net: ' + ws;
  }
  const extra = qs.get('x');
  if (extra) args.push(...extra.split(',').filter(Boolean));
  Module.arguments = args;
  // ENGINE SELECT. The default build carries -s ASYNCIFY, which rewrites
  // every function into a resumable state machine so emscripten_sleep() can
  // block — that instrumentation costs several times the runtime speed and
  // ~550 KB of code. The only things that need it are the netgame connect
  // wait and screen-wipe pacing, so SOLO play now uses a fast ASYNCIFY-free
  // build (I_Sleep is a no-op there; emscripten_set_main_loop already paces
  // frames). Netgames keep the ASYNCIFY build. ?engine= forces either.
  const wantsNet = !!qs.get('ws');
  const engineFile = (qs.get('engine') === 'fast') ? 'fast-doom.js'
    : (qs.get('engine') === 'websockets-doom') ? 'websockets-doom.js'
    : (wantsNet ? 'websockets-doom.js' : 'fast-doom.js');
  setBoot(8, 'loading engine (' + (engineFile === 'fast-doom.js' ? 'fast' : 'netplay') + ')…');
  const sc = document.createElement('script');
  sc.src = engineFile;
  sc.onerror = () => setBoot(100, 'BOOT FAILED: engine script failed to load');
  document.body.appendChild(sc);
})();

// ---------------------------------------------------------------------------
// Touch controls — synthesize keyboard events for SDL2's emscripten backend.
// keyCodes: arrows 37-40, Ctrl 17 (fire), Space 32 (use), , 188 . 190
// (strafe), Escape 27, Enter 13, y 89.
// ---------------------------------------------------------------------------
function sendKey(type, keyCode) {
  const ev = new KeyboardEvent(type, { keyCode, which: keyCode, bubbles: true });
  // SDL2 listens on window; KeyboardEvent keyCode is read-only in some
  // browsers when constructed — defineProperty forces it.
  try {
    Object.defineProperty(ev, 'keyCode', { get: () => keyCode });
    Object.defineProperty(ev, 'which', { get: () => keyCode });
  } catch (e) {}
  window.dispatchEvent(ev);
  document.dispatchEvent(ev);
  Module.canvas.dispatchEvent(ev);
}
// ---------------------------------------------------------------------------
// WASD. Chocolate Doom's vanilla bindings are arrows + , / . for strafe, and
// it reads them from its own config, which we can't edit from here. So instead
// of rebinding the engine, translate WASD into the keys it already knows:
//   W/S -> forward/back (same as up/down arrow)
//   A/D -> strafe left/right (the modern convention, and it matches the touch
//          pad, where the main left/right are strafe and the corners turn)
// Arrow keys keep working exactly as before, so both schemes are live at once.
// ---------------------------------------------------------------------------
const WASD = { KeyW: 38, KeyS: 40, KeyA: 188, KeyD: 190 };
const wasdHeld = new Set();
window.addEventListener('keydown', (e) => {
  const kc = WASD[e.code];
  // Let browser/OS shortcuts through (Ctrl+W etc.), and ignore auto-repeat:
  // the engine only needs the initial press to consider the key held.
  if (!kc || e.ctrlKey || e.metaKey || e.altKey || e.repeat || wasdHeld.has(e.code)) return;
  wasdHeld.add(e.code);
  e.preventDefault();
  sendKey('keydown', kc);
});
window.addEventListener('keyup', (e) => {
  const kc = WASD[e.code];
  if (!kc || !wasdHeld.has(e.code)) return;
  wasdHeld.delete(e.code);
  e.preventDefault();
  sendKey('keyup', kc);
});
// Losing focus mid-strafe would otherwise leave the key stuck down.
window.addEventListener('blur', () => {
  wasdHeld.forEach(code => sendKey('keyup', WASD[code]));
  wasdHeld.clear();
});

document.querySelectorAll('.pad button').forEach((b) => {
  if (!b.dataset.key) return;   // WPN / RUN have their own handlers
  const kc = +b.dataset.key;
  const down = (e) => { e.preventDefault(); b.classList.add('on'); sendKey('keydown', kc); };
  const up = (e) => { e.preventDefault(); b.classList.remove('on'); sendKey('keyup', kc); };
  b.addEventListener('touchstart', down, { passive: false });
  b.addEventListener('touchend', up, { passive: false });
  b.addEventListener('touchcancel', up, { passive: false });
  b.addEventListener('mousedown', down);
  b.addEventListener('mouseup', up);
  b.addEventListener('mouseleave', (e) => { if (b.classList.contains('on')) up(e); });
});
document.getElementById('btn-esc').addEventListener('click', () => {
  sendKey('keydown', 27); setTimeout(() => sendKey('keyup', 27), 80);
});
// The host's START control now lives on the WAITING FOR PLAYERS overlay,
// where it shows the live player count and needs a second tap to start
// without everyone. The old unconditional top-bar START button is gone: it
// was a single tap, on a black screen, that silently locked out every joiner.
document.getElementById('btn-enter').addEventListener('click', () => {
  sendKey('keydown', 13); setTimeout(() => sendKey('keyup', 13), 80);
});
document.getElementById('btn-yes').addEventListener('click', () => {
  sendKey('keydown', 89); setTimeout(() => sendKey('keyup', 89), 80);
});
// WPN button cycles weapon slots 2→3→4→5→6→7→1. Selecting an unowned slot
// is a harmless no-op in Doom, so tapping again advances to the next one.
// RUN LOCK. Doom's "speed" key is Shift, normally held. On a touchscreen there
// is no spare thumb for that, so this latches it: one tap sends keydown and
// never releases, so the engine sees Shift held until you tap again. The
// choice is remembered, and re-asserted after boot and whenever the tab is
// re-focused — a keydown with no matching keyup can otherwise be forgotten if
// the page loses focus while it is latched.
const RUN_KEY = 16;
let runLocked = false;
try { runLocked = localStorage.getItem('jerkwadRun') === '1'; } catch (e) {}
const runBtn = document.getElementById('btn-run');
function applyRunLock() {
  runBtn.classList.toggle('on', runLocked);
  runBtn.textContent = runLocked ? 'RUN●' : 'RUN';
  sendKey(runLocked ? 'keydown' : 'keyup', RUN_KEY);
}
runBtn.addEventListener('click', () => {
  runLocked = !runLocked;
  try { localStorage.setItem('jerkwadRun', runLocked ? '1' : '0'); } catch (e) {}
  applyRunLock();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && runLocked) applyRunLock(); });
runBtn.classList.toggle('on', runLocked);
runBtn.textContent = runLocked ? 'RUN●' : 'RUN';

const WPN_KEYS = [50, 51, 52, 53, 54, 55, 49];   // '2'..'7', then '1'
let wpnIdx = 0;
document.getElementById('btn-wpn').addEventListener('click', () => {
  const kc = WPN_KEYS[wpnIdx++ % WPN_KEYS.length];
  sendKey('keydown', kc);
  setTimeout(() => sendKey('keyup', kc), 80);
});
document.getElementById('btn-fs').addEventListener('click', () => {
  const el = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else {
    // No orientation lock: portrait is playable now, and forcing landscape
    // took the choice away from the player.
    const p = (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
    if (p && p.then) p.catch(() => {});
  }
});
// FIT keeps the picture's real proportions (default); FILL stretches it edge
// to edge. Both are just an object-fit swap via the body.fill class.
const fitBtn = document.getElementById('btn-fit');
function paintFitBtn() { fitBtn.textContent = fitMode === 'fit' ? 'FIT' : 'FILL'; }
paintFitBtn();
fitBtn.addEventListener('click', () => {
  fitMode = fitMode === 'fit' ? 'fill' : 'fit';
  try { localStorage.setItem('jerkwadFit', fitMode); } catch (e) {}
  paintFitBtn();
  applyFit();
});
document.getElementById('btn-sound').addEventListener('click', resumeAudio);
updateSoundHint();
</script>

</body>
</html>
