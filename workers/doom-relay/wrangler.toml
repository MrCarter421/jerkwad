# Wasm Doom message router (WebSocket relay) — vendored from
# github.com/cloudflare/doom-workers (BSD-3), configured for yuccabucca.com.
#
# Deploy:
#   cd workers/doom-relay
#   npx wrangler login
#   npx wrangler deploy
#
# Then players connect with:
#   https://yuccabucca.com/play/?ws=wss://doom.yuccabucca.com&server=1   (host)
#   https://yuccabucca.com/play/?ws=wss://doom.yuccabucca.com&join=1     (join)
name = "doom-relay"
main = "index.mjs"
compatibility_date = "2024-01-01"

routes = [
  { pattern = "doom.yuccabucca.com/*", zone_name = "yuccabucca.com" }
]

[durable_objects]
bindings = [
  { name = "router", class_name = "Router" },
  { name = "lobby", class_name = "Lobby" }
]

# Durable Objects. Use new_sqlite_classes (NOT new_classes): the free
# Workers plan only permits SQLite-backed Durable Objects, and our
# storage.put/get/list/delete calls work identically on that backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Router"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

# REQUIRED SECRET (room-id signing key — any long random string).
# Sets the value INTERACTIVELY (it prompts; don't put it on the CLI):
#   npx wrangler secret put DOOM_KEY
# Generate one with:  openssl rand -hex 32
